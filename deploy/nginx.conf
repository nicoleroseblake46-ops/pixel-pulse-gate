# Nginx reverse proxy config for the Vite SPA
# Place at: /etc/nginx/sites-available/nexuscc
# Symlink:  ln -s /etc/nginx/sites-available/nexuscc /etc/nginx/sites-enabled/nexuscc
# Reload:   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 127.0.0.1:8080;
    server_name _;

    # Path to the built SPA produced by `npm run build`
    root /opt/nexuscc/dist;
    index index.html;

    # Security headers (safe defaults for a Tor hidden service)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Hashed assets — cache aggressively
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every unknown route serves index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't leak hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
